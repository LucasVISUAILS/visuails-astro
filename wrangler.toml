# VISUAILS — Cloudflare Pages configuration.
# The site stays fully static (Astro `output: 'static'` -> dist/). The
# serverless bits live in /functions.
#
# NOTE: this Pages project runs in "config file" mode. Because this
# wrangler.toml exists, Cloudflare reads the bindings from HERE, not from the
# dashboard (the dashboard Bindings UI is disabled and points back to this
# file). So the D1 + R2 bindings and the non-secret vars live below.
#
# The RESEND_API_KEY is a SECRET and is deliberately NOT stored here (it would
# leak into git). Set it separately with either:
#   npx wrangler pages secret put RESEND_API_KEY
# or in the dashboard: your Pages project -> Settings -> Variables and Secrets
# -> add RESEND_API_KEY as an encrypted Secret.
#
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are secrets too, set the same
# way once you have them (BACKEND-SETUP.md §9). CONFIRMED 2026-07-28: `name`
# below does NOT match the actual Cloudflare Pages project name, which is
# "visuails-astro" (the .pages.dev subdomain gives it away). `wrangler pages
# secret put/delete` needs the REAL project name or it fails with
# `Project "visuails" does not exist.` — pass it explicitly:
#   npx wrangler pages secret put STRIPE_SECRET_KEY     --project-name visuails-astro
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name visuails-astro
# (RESEND_API_KEY was presumably set the same way, or from the dashboard,
# where this mismatch doesn't come up.)
# Until STRIPE_SECRET_KEY is set, functions/api/order.js skips Stripe entirely
# and the test-sample order behaves as it always has — no checkout, straight
# to thank-you. See src/lib/stripe.js and functions/api/webhook/stripe.js.

name = "visuails"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# --- Bindings ------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "visuails"
database_id = "941961a0-0180-4c41-9442-09a519584a95"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "visuails-uploads"

# --- Environment variables (non-secret) ----------------------------------------
[vars]
NOTIFY_EMAIL = "hello@visuails.com"
FROM_EMAIL = "VISUAILS <orders@visuails.com>"
# RESEND_API_KEY is intentionally NOT here -- it is a secret, set it separately
# (see the note at the top of this file).
