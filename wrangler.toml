# VISUAILS — Cloudflare Pages configuration.
# The site itself stays fully static (Astro `output: 'static'` → dist/). This
# file wires the serverless bits that live in /functions: the D1 database and
# (for a later phase) the R2 bucket for uploads/deliverables.
#
# Bindings can also be set in the Cloudflare dashboard (Pages project →
# Settings → Functions → Bindings). If you use the dashboard, this file is
# optional — but keeping it in git documents the setup and lets you use the
# Wrangler CLI (`wrangler pages deploy`, `wrangler d1 execute`, ...).

name = "visuails"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 (SQLite) database ---------------------------------------------------
# Create it once:  wrangler d1 create visuails
# then paste the printed database_id below (and bind it in the dashboard too).
[[d1_databases]]
binding = "DB"
database_name = "visuails"
database_id = "PASTE_DATABASE_ID_AFTER_wrangler_d1_create"

# --- R2 bucket (used from Phase 3: uploads + downloadable deliverables) ------
# Create it once:  wrangler r2 bucket create visuails-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "visuails-uploads"

# --- Plain (non-secret) vars ------------------------------------------------
[vars]
NOTIFY_EMAIL = "hello@visuails.com"          # where order notifications land
FROM_EMAIL   = "VISUAILS <orders@visuails.com>"  # must be on a Resend-verified domain

# --- Secrets (DO NOT put here) ----------------------------------------------
# Set these in the dashboard (Settings → Environment variables, "Encrypt")
# or via the CLI:
#   wrangler pages secret put RESEND_API_KEY
