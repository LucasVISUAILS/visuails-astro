# VISUAILS — Cloudflare Worker configuration.
#
# ── ÉÉN WORKER — 5 SEPTEMBER 2026 ────────────────────────────────────────────
#
# Tot deze datum was dit een Pages-project (`pages_build_output_dir = "dist"`):
# Astro bouwde de statische site en de serverkant stond ernaast in /functions,
# als Pages Functions. Sinds vandaag bouwt Astro via @astrojs/cloudflare ALLES in
# één keer: de statische pagina's als assets in dist/, en de server-routes
# (bestelling, betaling, dashboard, beheer, portaal) als één Worker in
# dist/server/entry.mjs. De handlers in /functions zijn niet veranderd; zie
# src/pages/api/, /account, /admin en /o voor de dunne endpoints die ze aanroepen.
#
# Wat dat verandert aan de commando's — `wrangler pages …` bestaat voor dit
# project niet meer:
#
#   deploy        npm run build && npx wrangler deploy
#   secret        npx wrangler secret put RESEND_API_KEY      (idem MOLLIE_API_KEY,
#                 ADMIN_*, SELLER_* — elke secret die de Pages-kant had; STRIPE_*
#                 niet meer sinds 19 september 2026)
#   logs          npx wrangler tail
#   lokaal        npm run build && npx wrangler dev            (lokale D1 + R2 in
#                 .wrangler/state; `npm run dev` kan het ook, via platformProxy)
#
# Assets gaan vóór de Worker: bestaat een bestand in dist/, dan komt het daar
# vandaan (met public/_headers en public/_redirects erbij) en draait de Worker
# niet. Alleen wat er niet ligt — /api/*, /account, /admin, /o — bereikt de code.
#
# ── DE NAAM ──────────────────────────────────────────────────────────────────
#
# Het Pages-project heette "visuails-astro" en de D1-database heet "visuails";
# die twee naast elkaar hebben op 10 augustus 2026 achttien dagen verwarring
# gekost (`Project "visuails" does not exist`). De Worker krijgt daarom een
# derde naam die op geen van beide lijkt. Hij verschijnt als
# visuails-site.<account>.workers.dev tot het domein is overgezet. (Dat is
# gebeurd; sinds 8 oktober staat dat adres uit, zie hieronder.)
#
# De secrets (RESEND_API_KEY, MOLLIE_API_KEY, …) staan NIET in dit bestand:
# `npx wrangler secret put <NAAM>`, of in het dashboard onder Workers ->
# visuails-site -> Settings -> Variables and Secrets. Ze moeten na de eerste
# deploy opnieuw gezet worden; een Worker deelt geen secrets met een Pages-project.

name = "visuails-site"
compatibility_date = "2026-07-01"
# Confirmed required: removing this broke the build with
# "No such module 'node:stream'" — something in a dependency imports it
# transitively, even though nothing in functions/ or src/ does directly.
# Ruled out as the cause of the empty Stripe 400s; do not remove again.
compatibility_flags = ["nodejs_compat"]

# ── ALLEEN VIA VISUAILS.COM — 8 oktober 2026 (punt o02) ──────────────────────
#
# De Worker draait op visuails.com en www.visuails.com via twee routes in de
# zone visuails.com (Lucas keek het na in het dashboard: Workers -> visuails-site
# -> Domains, type "Route"). Daarnaast stonden het workers.dev-adres
# (visuails-site.<subdomein>.workers.dev) en de preview-adressen
# (*-visuails-site.<subdomein>.workers.dev) aan. Die twee zijn een tweede en
# derde voordeur naar /admin, Studio en de API, met dezelfde database en
# bucket, en buiten elke regel die op de zone staat. Een preview-adres kan
# bovendien een OUDE versie draaien, zonder de fixes van later.
#
# Deze twee regels sluiten ze bij de volgende deploy. De routes zelf staan niet
# in dit bestand en worden door `wrangler deploy` niet aangeraakt.
workers_dev = false
preview_urls = false

# --- Geen `main`, geen [assets] ---------------------------------------------
# Die twee vult Astro's Cloudflare-adapter zelf in. Bij `npm run build` schrijft
# hij dist/server/wrangler.json (dit bestand plus main en de assets-map) en zet
# in .wrangler/deploy/config.json dat wrangler dáár moet kijken. `npx wrangler
# deploy` en `npx wrangler dev` vanuit de wortel volgen die verwijzing vanzelf.
# Zelf `main` zetten breekt de build: de adapter wil dat bestand vóór de build
# al zien liggen.

# --- Bindings ------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "visuails"
database_id = "941961a0-0180-4c41-9442-09a519584a95"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "visuails-uploads"

# --- Environment variables (non-secret) ----------------------------------------
[vars]
NOTIFY_EMAIL = "hello@visuails.com"
FROM_EMAIL = "VISUAILS <orders@visuails.com>"
# ── DE KOPIE VAN ELKE FACTUUR — 23 augustus 2026 ─────────────────────────────
#
# src/lib/invoiceMail.js zet `bcc: env.INVOICE_BCC` op elke uitgaande factuur, en
# die variabele stond in geen enkele config. Netto: de code was er sinds
# 20 augustus, de kopie ging nooit ergens heen, en dat is precies het soort stille
# uitschakeling dat je niet ziet — er komt geen fout, er komt alleen niets.
#
# Hetzelfde adres als NOTIFY_EMAIL, en dat is een keuze en geen gemak: de kopie
# hoort te landen waar je de andere studioberichten ook leest. Wordt het ooit een
# boekhouder, dan is dit de regel die verandert en verder niets.
INVOICE_BCC = "hello@visuails.com"
# RESEND_API_KEY is intentionally NOT here -- it is a secret, set it separately
# (see the note at the top of this file).

# ── OBSERVABILITY, AAN — 10 augustus 2026 ────────────────────────────────────
#
# Dit blok ontbrak in beide toml-bestanden, en daarmee was élke console.error in dit
# project alleen te zien in een live `wrangler tail`. Dat zijn de enige foutmeldingen die
# deze code heeft: een mislukte INSERT, een webhook die zijn bestelling niet vindt, een
# bestand dat niet opgeruimd kon worden. Om twee uur 's nachts keek daar dus niemand naar,
# en de dag erna was het weg.
#
# Met dit blok bewaart Cloudflare de logs (Workers Logs) en zijn ze achteraf te doorzoeken
# in het dashboard. Dat is geen monitoring — er komt geen melding van — maar het is het
# verschil tussen "we kunnen achterhalen wat er gebeurde" en "het is verdampt".
[observability]
enabled = true
