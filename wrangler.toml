# VISUAILS — Cloudflare Pages configuration.
# The site stays fully static (Astro `output: 'static'` -> dist/). The
# serverless bits live in /functions.
#
# NOTE: this Pages project runs in "config file" mode. Because this
# wrangler.toml exists, Cloudflare reads the bindings from HERE, not from the
# dashboard (the dashboard Bindings UI is disabled and points back to this
# file). So the D1 + R2 bindings and the non-secret vars live below.
#
# The RESEND_API_KEY is a SECRET and is deliberately NOT stored here (it would
# leak into git). Set it separately with either:
#   npx wrangler pages secret put RESEND_API_KEY --project-name visuails-astro
# or in the dashboard: your Pages project -> Settings -> Variables and Secrets
# -> add RESEND_API_KEY as an encrypted Secret.
#
# ── DE PROJECTNAAM STOND HIER FOUT — 10 AUGUSTUS 2026 ────────────────────────
#
# Hier stond `name = "visuails"`. Het Pages-project heet "visuails-astro", en dat
# verschil bleef achttien dagen onopgemerkt om één reden: de site wordt gebouwd via
# de GitHub-koppeling, en dan kiest Cloudflare het project niet op basis van dit
# veld. Elke deploy ging dus goed.
#
# Waar het wél op stukloopt is elk `wrangler pages`-commando, want dát leest de naam
# hier. `npx wrangler pages secret put SELLER_ADDRESS` antwoordde met
# `Project "visuails" does not exist` — een melding die klinkt als "je project is
# weg" terwijl het project er prima staat, alleen onder een andere naam. Vandaar dat
# de regel hierboven de naam nu ook expliciet noemt: het antwoord hoort in het
# bestand te staan en niet in het geheugen van degene die het een keer heeft
# uitgezocht.
#
# `visuails` is wél de naam van de D1-database (zie database_name onderaan). Die
# twee namen naast elkaar zijn precies waardoor dit kon ontstaan.

name = "visuails-astro"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"
# Confirmed required: removing this broke the build with
# "No such module 'node:stream'" — something in a dependency imports it
# transitively, even though nothing in functions/ or src/ does directly.
# Ruled out as the cause of the empty Stripe 400s; do not remove again.
compatibility_flags = ["nodejs_compat"]

# --- Bindings ------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "visuails"
database_id = "941961a0-0180-4c41-9442-09a519584a95"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "visuails-uploads"

# --- Environment variables (non-secret) ----------------------------------------
[vars]
NOTIFY_EMAIL = "hello@visuails.com"
FROM_EMAIL = "VISUAILS <orders@visuails.com>"
# ── DE KOPIE VAN ELKE FACTUUR — 23 augustus 2026 ─────────────────────────────
#
# src/lib/invoiceMail.js zet `bcc: env.INVOICE_BCC` op elke uitgaande factuur, en
# die variabele stond in geen enkele config. Netto: de code was er sinds
# 20 augustus, de kopie ging nooit ergens heen, en dat is precies het soort stille
# uitschakeling dat je niet ziet — er komt geen fout, er komt alleen niets.
#
# Hetzelfde adres als NOTIFY_EMAIL, en dat is een keuze en geen gemak: de kopie
# hoort te landen waar je de andere studioberichten ook leest. Wordt het ooit een
# boekhouder, dan is dit de regel die verandert en verder niets.
INVOICE_BCC = "hello@visuails.com"
# RESEND_API_KEY is intentionally NOT here -- it is a secret, set it separately
# (see the note at the top of this file).

# ── OBSERVABILITY, AAN — 10 augustus 2026 ────────────────────────────────────
#
# Dit blok ontbrak in beide toml-bestanden, en daarmee was élke console.error in dit
# project alleen te zien in een live `wrangler tail`. Dat zijn de enige foutmeldingen die
# deze code heeft: een mislukte INSERT, een webhook die zijn bestelling niet vindt, een
# bestand dat niet opgeruimd kon worden. Om twee uur 's nachts keek daar dus niemand naar,
# en de dag erna was het weg.
#
# Met dit blok bewaart Cloudflare de logs (Workers Logs) en zijn ze achteraf te doorzoeken
# in het dashboard. Dat is geen monitoring — er komt geen melding van — maar het is het
# verschil tussen "we kunnen achterhalen wat er gebeurde" en "het is verdampt".
[observability]
enabled = true
